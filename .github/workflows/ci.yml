# noinspection YAMLSchemaValidation,GithubUnresolvedReference
name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --watch=false
        env:
          CI: true
          VITEST_WATCH: false
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build frontend image for scan
        run: |
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="ci-scan-client-id" \
            --build-arg VITE_USE_HEADER_AUTH="false" \
            --build-arg VITE_USER_ID="" \
            --build-arg VITE_PUBLIC_ORIGIN="http://127.0.0.1:3000" \
            --build-arg VITE_PUBLIC_HOST_ALLOWLIST="127.0.0.1:3000" \
            -t tradingview-frontend:${{ github.sha }} \
            -f Dockerfile \
            .
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tradingview-frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-pr-dev:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dev-app-runner-frontend
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Resume dev App Runner services
        env:
          DEV_FRONTEND_SERVICE_ARN: ${{ secrets.DEV_FRONTEND_SERVICE_ARN }}
          DEV_BACKEND_SERVICE_ARN: ${{ secrets.DEV_BACKEND_SERVICE_ARN }}
        run: |
          set -euo pipefail
          bash .github/scripts/apprunner-lifecycle.sh resume "${DEV_BACKEND_SERVICE_ARN}" "${DEV_FRONTEND_SERVICE_ARN}"
      - name: Build and push PR frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.DEV_ECR_TRADINGVIEW_REPO }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          VITE_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
          VITE_USE_HEADER_AUTH: "false"
          VITE_USER_ID: ""
          VITE_PUBLIC_ORIGIN: ${{ secrets.DEV_PUBLIC_ORIGIN }}
          VITE_PUBLIC_HOST_ALLOWLIST: ${{ secrets.DEV_PUBLIC_HOST_ALLOWLIST }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" \
            --build-arg VITE_USE_HEADER_AUTH="${VITE_USE_HEADER_AUTH}" \
            --build-arg VITE_USER_ID="${VITE_USER_ID}" \
            --build-arg VITE_PUBLIC_ORIGIN="${VITE_PUBLIC_ORIGIN}" \
            --build-arg VITE_PUBLIC_HOST_ALLOWLIST="${VITE_PUBLIC_HOST_ALLOWLIST}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -f Dockerfile \
            .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
      - name: Deploy PR frontend to App Runner dev
        env:
          SERVICE_ARN: ${{ secrets.DEV_FRONTEND_SERVICE_ARN }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.DEV_ECR_TRADINGVIEW_REPO }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/apprunner-frontend.json <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "${IMAGE}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "3000"
              }
            }
          }
          EOF
          aws apprunner update-service --service-arn "${SERVICE_ARN}" --source-configuration file:///tmp/apprunner-frontend.json
          bash .github/scripts/apprunner-lifecycle.sh wait-running "${SERVICE_ARN}"
