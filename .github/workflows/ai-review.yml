# noinspection YAMLSchemaValidation,GithubUnresolvedReference
name: AI PR Review

# Reviews a PR on demand from a PR comment:
#   /ai-review [light|standard|deep|security] [anthropic|openai|both]
# The security tier's OpenAI review uses Daybreak Blue, which must be enabled on the OPENAI_API_REVIEWER_KEY's project.
# Comment-triggered workflows run from the default branch, so changes here take effect once merged to main.
# Tiers, models and prices live in .github/ai-review/review-pull-request.mjs.
# Secrets: ANTHROPIC_REVIEWER_API_KEY, OPENAI_API_REVIEWER_KEY (dedicated keys, so review spend is tracked apart).
# Optional variables: AI_REVIEW_DEFAULT_TIER (standard), AI_REVIEW_DEFAULT_PROVIDERS (both).
on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/ai-review')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ai-review
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/ai-review/package-lock.json
      - name: Install
        run: npm ci --prefix .github/ai-review --ignore-scripts
      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_REVIEWER_API_KEY: ${{ secrets.ANTHROPIC_REVIEWER_API_KEY }}
          OPENAI_API_REVIEWER_KEY: ${{ secrets.OPENAI_API_REVIEWER_KEY }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          REVIEW_COMMAND: ${{ github.event.comment.body }}
          REVIEW_COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
          DEFAULT_REVIEW_TIER: ${{ vars.AI_REVIEW_DEFAULT_TIER || 'standard' }}
          DEFAULT_REVIEW_PROVIDERS: ${{ vars.AI_REVIEW_DEFAULT_PROVIDERS || 'both' }}
        run: node .github/ai-review/review-pull-request.mjs
